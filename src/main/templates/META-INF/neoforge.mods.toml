modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Sorukoma/Quasium-1.21.1/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Sorukoma/Quasium-1.21.1"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Hard requirement: the backpack hookah is a Curios back-slot item and the mod
# touches the Curios API during registration, so it cannot load without it.
[[dependencies.${mod_id}]]
    modId="curios"
    type="required"
    versionRange="[9.5.1+1.21.1,)"
    ordering="AFTER"
    side="BOTH"

# Recipe viewers — the integration classes only load when the viewer is installed.
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[19.19.0.0,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="emi"
    type="optional"
    versionRange="[1.1.0,)"
    ordering="AFTER"
    side="CLIENT"
